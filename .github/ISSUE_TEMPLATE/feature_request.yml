name: Feature request
description: Suggest an idea for Tokenamp
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing or annoying
      description: What are you trying to do, and where does Tokenamp get in the way?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you'd like instead
      description: Your idea for how it should work. Sketches or references to other Winamp skins/plugins welcome.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workaround you're using now, or other ways to solve this.
    validations:
      required: false
